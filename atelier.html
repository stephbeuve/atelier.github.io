<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Atelier, l’app des conseillers Expertimo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Atelier — système de design (approche charte Expertimo)
   Relevé sur expertimo.com : Barlow, noir chaud #191617, or #E8C461 → #CA9936,
   turquoise #1F9DA9, boutons en pilule.
   ============================================================ */
:root{
  /* surfaces & texte */
  --bg:#F4F3F1; --surface:#FFFFFF; --sunk:#EFEDEA; --ink:#191617; --muted:#5B5A5E;
  --line:#E2DFDA; --line-strong:#C9C5BE;
  /* marque */
  --gold:#CA9936; --gold-hi:#E8C461; --gold-ink:#7A5A12; --gold-soft:#FBF4E0;
  --teal:#1F9DA9; --teal-ink:#12707A; --teal-soft:#E0F2F3;
  --info:#3C6A8A; --info-soft:#E3ECF3;
  --warn:#A8432A; --warn-soft:#F8E6DF;
  --gold-grad:linear-gradient(135deg,#E8C461,#CA9936);
  /* compat avec les anciens noms utilisés dans les vues */
  --olive:var(--teal-ink); --olive-soft:var(--teal-soft);
  --brass:var(--gold-ink); --brass-soft:var(--gold-soft);
  --sky:var(--info); --sky-soft:var(--info-soft); --ok:var(--teal-ink);
  /* rail latéral (sombre dans les deux thèmes) */
  --rail-bg:#191617; --rail-ink:#F4F1EC; --rail-muted:#A9A49E; --rail-line:#2F2B2C; --rail-hover:#262223;
  /* typo, rayons, ombres */
  --ui:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --display:var(--ui);
  --rail:256px; --r:14px; --r-sm:10px; --pill:999px;
  --shadow:0 1px 2px rgba(25,22,23,.06),0 4px 16px rgba(25,22,23,.05);
  --shadow-pop:0 12px 40px rgba(25,22,23,.22);
  --focus:#12707A;
  --tap:44px;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#141112; --surface:#1E1B1C; --sunk:#272324; --ink:#F2EFEA; --muted:#A9A5A0;
  --line:#34302F; --line-strong:#4A4544;
  --gold:#E8C461; --gold-ink:#EAC768; --gold-soft:#3A2F14;
  --teal:#3CC0CC; --teal-ink:#5CC8D2; --teal-soft:#123438;
  --info:#8DB5D3; --info-soft:#1F2F3B; --warn:#F0A088; --warn-soft:#3F211A;
  --rail-bg:#0F0D0E; --rail-hover:#1B1819; --rail-line:#262223; --focus:#5CC8D2;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-pop:0 12px 40px rgba(0,0,0,.6); } }
:root[data-theme="dark"]{
  --bg:#141112; --surface:#1E1B1C; --sunk:#272324; --ink:#F2EFEA; --muted:#A9A5A0;
  --line:#34302F; --line-strong:#4A4544;
  --gold:#E8C461; --gold-ink:#EAC768; --gold-soft:#3A2F14;
  --teal:#3CC0CC; --teal-ink:#5CC8D2; --teal-soft:#123438;
  --info:#8DB5D3; --info-soft:#1F2F3B; --warn:#F0A088; --warn-soft:#3F211A;
  --rail-bg:#0F0D0E; --rail-hover:#1B1819; --rail-line:#262223; --focus:#5CC8D2;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-pop:0 12px 40px rgba(0,0,0,.6); }

html{height:100%; scroll-padding-top:72px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:400 16px/1.55 var(--ui); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px}
h1,h2,h3,h4{font-family:var(--ui); margin:0; color:var(--ink); font-variant-numeric:lining-nums}
h1{font-size:clamp(28px,3.4vw,38px); line-height:1.08; font-weight:800; letter-spacing:-.015em}
h2{font-size:26px; line-height:1.15; font-weight:700; letter-spacing:-.01em}
h3{font-size:18px; line-height:1.25; font-weight:700}
h4{font-size:13px; font-weight:600}
p{margin:0}
a{color:inherit}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:6px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.skip{position:absolute; left:12px; top:-60px; z-index:100; background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:var(--pill); text-decoration:none; font-weight:600}
.skip:focus{top:12px}

/* ---------- structure ---------- */
.app{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100vh}
.rail{position:sticky; top:0; height:100vh; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#3A3536 transparent; padding:24px 14px 18px; background:var(--rail-bg); color:var(--rail-ink); display:flex; flex-direction:column; gap:22px}
.brand{display:flex; align-items:center; gap:12px; padding:0 8px}
.brand .mark{width:36px; height:36px; border-radius:10px; background:var(--gold-grad); color:#191617; display:grid; place-items:center; font-weight:800; font-size:20px; flex:none}
.brand b{display:block; font-size:21px; font-weight:800; letter-spacing:-.01em; line-height:1.1}
.brand span.sub{display:block; font-size:12.5px; color:var(--rail-muted)}
.nav{display:flex; flex-direction:column; gap:18px}
.grp{display:flex; flex-direction:column; gap:2px}
.grp-label{font-size:11.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--rail-muted); padding:0 12px 6px}
.nav button{all:unset; box-sizing:border-box; cursor:pointer; position:relative; display:flex; align-items:center; gap:12px; min-height:44px; padding:0 12px; border-radius:var(--r-sm); color:#D8D3CC; font-weight:500; transition:background .15s,color .15s}
.nav button:hover{background:var(--rail-hover); color:#fff}
.nav button[aria-current="page"]{background:var(--rail-hover); color:#fff; font-weight:600}
.nav button[aria-current="page"]::before{content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:2px; background:var(--gold-hi)}
.nav button:focus-visible{outline:2px solid var(--gold-hi); outline-offset:-2px}
.nav svg{width:20px; height:20px; flex:none}
.opt{margin-left:auto; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:2px 8px; border-radius:var(--pill); border:1px solid currentColor; opacity:.75}
.who{margin-top:auto; display:flex; align-items:center; gap:12px; padding:14px 10px 0; border-top:1px solid var(--rail-line)}
.who .av{width:38px; height:38px; border-radius:50%; background:#2F2B2C; color:var(--gold-hi); display:grid; place-items:center; font-weight:700; flex:none}
.who b{display:block; font-weight:600; line-height:1.2}
.who span.s{display:block; font-size:12.5px; color:var(--rail-muted)}
.col-main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:60px; padding:0 clamp(16px,4vw,48px); background:var(--bg); border-bottom:1px solid var(--line)}
.tb-l{display:flex; align-items:baseline; gap:10px; min-width:0}
.tb-brand{display:none; font-weight:800; font-size:19px}
.crumb{font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tb-r{display:flex; align-items:center; gap:10px}
.iconbtn{all:unset; box-sizing:border-box; cursor:pointer; width:var(--tap); height:var(--tap); border-radius:50%; display:grid; place-items:center; color:var(--muted); transition:background .15s,color .15s}
.iconbtn:hover{background:var(--sunk); color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--focus); outline-offset:0}
.iconbtn svg{width:20px; height:20px}
main{min-width:0; padding:32px clamp(16px,4vw,48px) 88px}
.view{max-width:1160px; margin:0 auto; outline:none}
.view.in{animation:vin .2s ease-out}
@keyframes vin{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
.tabbar,.sheet,.scrim{display:none}

/* ---------- bandeau de démonstration ---------- */
.demo{margin-bottom:22px; font-size:13.5px; color:var(--muted)}
.demo summary{list-style:none; cursor:pointer; display:inline-flex; align-items:center; gap:8px; padding:6px 12px 6px 10px; border-radius:var(--pill); background:var(--sunk); min-height:32px}
.demo summary::-webkit-details-marker{display:none}
.demo summary::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--gold)}
.demo summary::after{content:"+"; font-weight:700; margin-left:4px}
.demo[open] summary::after{content:"\2212"}
.demo p{margin-top:10px; max-width:70ch}

/* ---------- composants communs ---------- */
.head{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:24px}
.head p{max-width:64ch; margin-top:10px; color:var(--muted); font-size:16px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 20px; border:1px solid var(--ink); background:var(--ink); color:var(--surface); border-radius:var(--pill); font-weight:600; white-space:nowrap; transition:filter .15s,background .15s,border-color .15s,transform .1s}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line-strong)}
.btn.ghost:hover{filter:none; border-color:var(--ink); background:var(--sunk)}
.btn.olive,.btn.brass{background:var(--gold-grad); border-color:#CA9936; color:#191617}
.btn.olive:hover,.btn.brass:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn.sm{min-height:36px; padding:0 14px; font-size:14px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:24px; box-shadow:var(--shadow)}
.panel > h3:first-child{margin-bottom:4px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px}
.split{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:24px; align-items:start}
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 11px; min-height:26px; border-radius:var(--pill); background:var(--sunk); color:var(--ink); font-size:13px; font-weight:500; max-width:100%; line-height:1.3}
.chip.olive{background:var(--teal-soft); color:var(--teal-ink)}
.chip.brass{background:var(--gold-soft); color:var(--gold-ink)}
.chip.sky{background:var(--info-soft); color:var(--info)}
.chip.warn{background:var(--warn-soft); color:var(--warn)}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.stack{display:flex; flex-direction:column; gap:12px}
.hr{height:1px; background:var(--line); margin:20px 0}
.kv{display:grid; grid-template-columns:auto 1fr; gap:8px 20px; font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:14.5px}
th{font-size:12.5px; font-weight:600; letter-spacing:.03em; color:var(--muted); text-align:left; padding:10px 12px; border-bottom:1px solid var(--line-strong); white-space:nowrap}
td{padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
tr.out td{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--warn)}
.field{display:flex; flex-direction:column; gap:6px; font-size:14px; font-weight:500; color:var(--muted)}
.field input,.field select,textarea,.addin,.parcctl select,.bksel{background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r-sm); padding:10px 12px; min-height:44px; color:var(--ink)}
textarea{width:100%; resize:vertical; min-height:120px; line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus); outline-offset:0; border-color:var(--focus)}
.ai-out{white-space:pre-wrap; line-height:1.6}
.thinking{display:inline-flex; gap:8px; align-items:center; color:var(--muted)}
.thinking::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--gold); animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3; transform:scale(.7)}}
.note{font-size:14px; color:var(--muted); border-left:3px solid var(--gold); padding-left:12px}
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:24px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset; box-sizing:border-box; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:0 16px; color:var(--muted); font-weight:500; border-bottom:3px solid transparent; margin-bottom:-1px; white-space:nowrap; transition:color .15s,border-color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink); font-weight:700; border-color:var(--gold)}
.tabs button:focus-visible{outline:2px solid var(--focus); outline-offset:-2px}
.tabs .lk{font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:1px 7px; border-radius:var(--pill); background:var(--gold-soft); color:var(--gold-ink)}
.toggle{position:relative; width:48px; height:28px; flex:none}
.toggle input{opacity:0; position:absolute; inset:-8px; width:calc(100% + 16px); height:calc(100% + 16px); cursor:pointer; margin:0}
.toggle span{position:absolute; inset:0; border-radius:var(--pill); background:var(--line-strong); transition:background .2s}
.toggle span::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .2s}
.toggle input:checked + span{background:var(--teal-ink)}
.toggle input:checked + span::after{transform:translateX(20px)}
.toggle input:disabled + span{opacity:.5}
.toggle input:focus-visible + span{outline:2px solid var(--focus); outline-offset:2px}
code{font-size:12.5px; background:var(--sunk); padding:1px 6px; border-radius:4px; overflow-wrap:anywhere}
details summary{cursor:pointer; color:var(--muted); font-size:14px; padding:12px 0}

/* ---------- Aujourd'hui ---------- */
.brief{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:24px}
.action{display:grid; grid-template-columns:36px 1fr auto; gap:14px; padding:18px 0; border-bottom:1px solid var(--line); align-items:start}
.action:first-of-type{padding-top:12px}
.action:last-child{border-bottom:0}
.action .n{width:32px; height:32px; border-radius:50%; background:var(--gold-soft); color:var(--gold-ink); display:grid; place-items:center; font-weight:800; font-size:15px}
.action b{display:block; font-weight:600; font-size:16.5px; margin-bottom:2px}
.dictate{display:flex; gap:12px; align-items:flex-start}
.mic{all:unset; box-sizing:border-box; cursor:pointer; width:var(--tap); height:var(--tap); border-radius:50%; display:grid; place-items:center; background:var(--teal-ink); color:#fff; flex:none; transition:background .15s}
.mic:hover{filter:brightness(1.1)}
.mic:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.mic[aria-pressed="true"]{background:var(--warn)}
.result-block{margin-top:16px; display:grid; gap:12px}
.result-block .card{border:1px solid var(--line); border-radius:var(--r-sm); padding:16px; background:var(--bg)}
.assist{display:flex; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--pill); padding:6px 6px 6px 8px; margin-bottom:10px; box-shadow:var(--shadow)}
.assist input{flex:1; min-width:0; border:0; background:transparent; padding:10px 6px; outline:none; font-size:16px}
.assist:focus-within{border-color:var(--focus); box-shadow:0 0 0 2px var(--focus)}
.assist .btn{min-height:44px}
.assist-res{display:flex; flex-direction:column; gap:6px; align-items:flex-start; background:var(--teal-soft); border-radius:var(--r-sm); padding:14px 16px; margin:8px 0 20px}
.alert{display:grid; grid-template-columns:124px 1fr auto; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0; padding-bottom:0}
.alert .chip{justify-content:center}
.timeline{position:relative; padding-left:22px}
.timeline::before{content:""; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background:var(--line)}
.timeline > div{position:relative; padding:8px 0; font-size:14.5px; line-height:1.4}
.timeline > div::before{content:""; position:absolute; left:-21px; top:14px; width:10px; height:10px; border-radius:50%; background:var(--surface); border:2px solid var(--gold)}
.timeline br{display:none}
.timeline b{display:block; font-weight:600; font-size:13px; color:var(--gold-ink)}

/* ---------- Estimation ---------- */
.value-hero{display:flex; flex-direction:column; gap:4px}
.value-hero .v{font-size:clamp(40px,5.4vw,60px); line-height:1; font-weight:800; letter-spacing:-.02em; font-variant-numeric:lining-nums tabular-nums}
.grid3 .value-hero .v{font-size:40px}
.range{position:relative; height:48px; margin:20px 0 8px}
.range .bar{position:absolute; top:20px; left:0; right:0; height:8px; border-radius:4px; background:var(--sunk)}
.range .band{position:absolute; top:20px; height:8px; border-radius:4px; background:var(--gold-hi); opacity:.85}
.range .pin{position:absolute; top:10px; width:3px; height:28px; border-radius:2px; background:var(--ink)}
.range .lab{position:absolute; top:-2px; font-size:12.5px; color:var(--muted); transform:translateX(-50%); white-space:nowrap}
.src{display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:12px 0; border-bottom:1px solid var(--line)}
.src:last-child{border-bottom:0}
.adj{display:grid; grid-template-columns:1fr 120px 60px; gap:12px; align-items:center; padding:8px 0; font-size:14.5px}
.adj input[type=range]{width:100%; accent-color:var(--teal-ink); min-height:28px}
.adj output{text-align:right; font-variant-numeric:tabular-nums; font-weight:600}

/* ---------- Studio 3D ---------- */
.studio{position:relative; border-radius:var(--r); overflow:hidden; background:#211E1F; min-height:520px; height:62vh; max-height:700px}
.studio canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
.studio canvas:active{cursor:grabbing}
.studio .labels{position:absolute; inset:0; pointer-events:none}
.studio .rl{position:absolute; transform:translate(-50%,-50%); font-size:12.5px; color:#fff; background:rgba(25,22,23,.82); padding:3px 10px; border-radius:var(--pill); white-space:nowrap}
.studio .hud{position:absolute; left:14px; right:14px; bottom:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; pointer-events:none}
.studio .hud > *{pointer-events:auto}
.seg{display:inline-flex; background:rgba(25,22,23,.88); border-radius:var(--pill); padding:4px}
.seg button{all:unset; box-sizing:border-box; cursor:pointer; color:#D8D3CC; min-height:36px; display:inline-flex; align-items:center; padding:0 14px; border-radius:var(--pill); font-size:14px; font-weight:500}
.seg button[aria-pressed="true"]{background:var(--gold-grad); color:#191617; font-weight:600}
.seg button:focus-visible{outline:2px solid #fff; outline-offset:1px}
.sunctl{background:rgba(25,22,23,.88); color:#F2EFEA; border-radius:var(--r-sm); padding:8px 14px; font-size:14px; display:flex; gap:10px; align-items:center}
.sunctl input{accent-color:#E8C461; width:150px}
.roomcard{position:absolute; top:14px; right:14px; width:260px; max-width:calc(100% - 28px); background:#fff; color:#191617; border-radius:var(--r-sm); padding:16px; font-size:14px; box-shadow:var(--shadow-pop)}
.roomcard h3{font-size:19px; color:#191617}
.compass{position:absolute; top:14px; left:14px; color:#D8D3CC; font-size:12.5px; text-align:center}
.pipeline{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin-top:20px; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.pipeline > div{padding:18px; border-right:1px solid var(--line)}
.pipeline > div:last-child{border-right:0}
.pipeline .st{font-size:20px; font-weight:800; color:var(--gold-ink)}
.pipeline .done{background:var(--teal-soft)}

/* ---------- Vitrine (aperçu client) ---------- */
.vitrine{background:#FBFAF8; color:#191617; border-radius:var(--r); overflow:hidden; border:1px solid var(--line)}
.vitrine h2,.vitrine h3{color:#191617}
.vitrine .cover{position:relative; aspect-ratio:16/8; background:#C9B79A; display:block}
.vitrine .cover svg{position:absolute; inset:0; width:100%; height:100%}
.vitrine .cover::after{content:""; position:absolute; inset:45% 0 0 0; background:linear-gradient(transparent,rgba(25,22,23,.62))}
.vitrine .cover .cap{position:absolute; z-index:1; left:28px; bottom:22px; color:#fff; text-shadow:0 1px 12px rgba(0,0,0,.4)}
.vitrine .cover .cap h2{font-size:clamp(32px,5vw,56px); font-weight:800; color:#fff}
.vitrine .body{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:36px; padding:36px}
.vitrine .lede{font-size:21px; line-height:1.5; font-weight:300; font-variant-numeric:lining-nums}
.vitrine .facts{display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; font-size:14.5px}
.vitrine .facts b{display:block; font-size:28px; font-weight:700; font-variant-numeric:lining-nums}
.vitrine .price{font-size:30px; font-weight:700; font-variant-numeric:lining-nums}
.vitrine .muted{color:#5B5A5E}
.compliance li{margin:4px 0}

/* ---------- Matchmaker / acquéreurs ---------- */
.crit{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:12px 0; border-bottom:1px solid var(--line); font-size:14.5px}
.crit:last-child{border-bottom:0}
.crit > div:first-child{flex:1 1 100%; min-width:0}
.crit label{margin-left:auto}
.crit q{color:var(--muted); font-size:13px; display:block}
.imp{display:inline-flex; border:1px solid var(--line-strong); border-radius:var(--pill); overflow:hidden}
.imp button{all:unset; box-sizing:border-box; cursor:pointer; min-height:32px; display:inline-flex; align-items:center; padding:0 12px; font-size:13px; color:var(--muted)}
.imp button[aria-pressed="true"]{background:var(--ink); color:var(--surface); font-weight:600}
.imp button:focus-visible{outline:2px solid var(--focus); outline-offset:-2px}
.match{display:grid; grid-template-columns:96px minmax(0,1fr); gap:18px; padding:20px 0; border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.score{width:86px; height:86px; position:relative}
.score svg{width:100%; height:100%; transform:rotate(-90deg)}
.score b{position:absolute; inset:0; display:grid; place-items:center; font-size:26px; font-weight:800}
.why{display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; margin-top:10px; font-size:14px}
.why .y::before{content:"\2713\00a0"; color:var(--teal-ink); font-weight:700}
.why .n::before{content:"\2022\00a0"; color:var(--warn); font-weight:700}
.acqwrap{display:grid; grid-template-columns:290px minmax(0,1fr); gap:20px; align-items:start}
.acqlist{position:sticky; top:76px; max-height:calc(100vh - 96px); overflow:auto}
.acqrow{display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); color:var(--ink); padding:12px 14px; margin-bottom:8px; min-height:var(--tap); transition:border-color .15s,background .15s}
.acqrow b{font-weight:600; font-size:15px}
.acqrow:hover{border-color:var(--gold)}
.acqrow.on{border-color:var(--gold); background:var(--gold-soft); box-shadow:inset 3px 0 0 var(--gold)}
.acqct{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 18px; font-size:14.5px}
.acqct a{color:var(--info)}
.newgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.newgrid label{display:flex; flex-direction:column; gap:6px; font-size:13.5px; font-weight:500; color:var(--muted)}
.consentbox{display:flex; flex-direction:column; gap:6px; justify-content:flex-end}
.parcgrid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px}
.parcgrid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.parcmap{width:100%; height:auto; border:1px solid var(--line); border-radius:var(--r-sm); display:block}
.parcctl{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2fr); gap:12px}
.parcctl label{display:flex; flex-direction:column; gap:6px; font-size:13.5px; font-weight:500; color:var(--muted)}
.facts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.facts div{display:flex; flex-direction:column}
.facts b{font-weight:600; font-size:15px; overflow-wrap:anywhere}
.note-line{display:flex; gap:10px; align-items:flex-start; margin-top:8px}
.note-line .dot{width:8px; height:8px; border-radius:50%; margin-top:8px; flex:none; background:var(--muted)}
.note-line.olive .dot{background:var(--teal-ink)} .note-line.brass .dot{background:var(--gold)} .note-line.warn .dot{background:var(--warn)}

/* ---------- Vendeur Live (mobile du vendeur) ---------- */
.phone{width:min(360px,100%); margin:0 auto; border:10px solid #191617; border-radius:36px; background:#FBFAF8; color:#191617; padding:22px 18px; min-height:600px}
.phone .big{font-size:40px; line-height:1; font-weight:800}
.phone .tile{background:#fff; border-radius:var(--r-sm); padding:12px 14px; margin-top:10px; font-size:14px}
.spark{display:flex; gap:4px; align-items:flex-end; height:46px; margin-top:8px}
.spark i{flex:1; background:#12707A; border-radius:2px 2px 0 0}

/* ---------- Abonnement ---------- */
.mod{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; padding:20px 0; border-bottom:1px solid var(--line); align-items:start}
.mod:last-child{border-bottom:0}
.mod .partners{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap}
.presets{display:flex; gap:8px; flex-wrap:wrap}
.presets button[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}

/* ---------- Revue critique, verrouillé ---------- */
.critic{display:grid; grid-template-columns:44px minmax(0,1fr); gap:16px; padding:22px 0; border-bottom:1px solid var(--line)}
.critic:last-child{border-bottom:0}
.critic .av{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--gold-soft); color:var(--gold-ink); font-weight:800; font-size:18px}
.critic blockquote{margin:6px 0 10px; font-size:19px; line-height:1.4; font-weight:500}
.locked{display:grid; place-items:center; text-align:center; min-height:320px; gap:14px; padding:40px; border:1px dashed var(--line-strong); border-radius:var(--r); background:var(--surface)}
.locked p{max-width:54ch}

/* ---------- Relances & automatisations ---------- */
.flow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; padding:18px 0; border-bottom:1px solid var(--line); align-items:center}
.flow:last-child{border-bottom:0}
.flow .steps{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; font-size:13.5px}
.flow .steps span{background:var(--sunk); border-radius:var(--r-sm); padding:3px 10px}

/* ---------- Pilotage / KPI ---------- */
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:20px}
.kpi .v{font-size:38px; line-height:1; font-weight:800; font-variant-numeric:lining-nums tabular-nums}
.bars .b{display:grid; grid-template-columns:150px 1fr 48px; gap:12px; align-items:center; font-size:14.5px; padding:6px 0}
.bars .t{height:10px; border-radius:5px; background:var(--sunk); overflow:hidden} .bars .t i{display:block; height:100%; background:var(--teal-ink); border-radius:5px}
.meter{height:10px; border-radius:5px; background:var(--sunk); overflow:hidden; margin:8px 0 4px} .meter i{display:block; height:100%; background:var(--gold)}
.methods{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.method{border:1px solid var(--line); border-radius:var(--r-sm); padding:14px; background:var(--bg)}
.method .v{font-size:24px; font-weight:700; font-variant-numeric:lining-nums tabular-nums}
.dpe{display:inline-grid; place-items:center; width:26px; height:24px; border-radius:5px; font-weight:700; font-size:13px}
.offer{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 14px; padding:16px 0; border-bottom:1px solid var(--line)}
.offer:last-child{border-bottom:0}
.check li{list-style:none; margin:8px 0; padding-left:28px; position:relative}
.check li::before{content:""; position:absolute; left:0; top:3px; width:18px; height:18px; border-radius:5px; border:2px solid var(--line-strong)}
.check li.ok::before{background:var(--teal-ink); border-color:var(--teal-ink)}
.check li.ok::after{content:""; position:absolute; left:6px; top:6px; width:5px; height:9px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}
.portal{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line)}
.portal:last-child{border-bottom:0}
.minisite{border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; background:#FBFAF8; color:#191617}
.minisite .top{padding:18px; background:#191617; color:#F4F1EC}
.minisite .top b{font-size:24px; font-weight:800}

/* ---------- Kanban prospection ---------- */
.kanban{display:grid; grid-template-columns:repeat(5,minmax(200px,1fr)); gap:14px; overflow-x:auto; padding-bottom:8px}
.col{background:var(--sunk); border-radius:var(--r); padding:12px; min-height:220px}
.col h4{margin:0 0 10px; font-size:13px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--muted)}
.card2{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:12px; margin-bottom:8px; font-size:14px; box-shadow:var(--shadow)}
.card2 b{display:block; font-weight:600}
.kc{position:relative; padding-left:26px; cursor:grab; touch-action:pan-y; user-select:none; -webkit-user-select:none}
.kc .grip{position:absolute; left:6px; top:12px; width:14px; text-align:center; color:var(--muted); font-size:13px; line-height:1; letter-spacing:-2px; touch-action:none; cursor:grab}
.kc.dragging{opacity:.35}
.kc.landed{animation:kland .9s ease-out}
@keyframes kland{0%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
.kghost{position:fixed; z-index:60; pointer-events:none; margin:0; box-shadow:var(--shadow-pop); transform:rotate(1.5deg); opacity:.96}
.kdrag,.kdrag *{cursor:grabbing !important; user-select:none !important; -webkit-user-select:none !important}
.col.over{outline:2px dashed var(--gold); outline-offset:-2px; background:var(--gold-soft)}
.col .cards{min-height:44px}
.dropmark{height:3px; border-radius:2px; background:var(--gold); margin:2px 0 8px}
.kfoot{display:flex; justify-content:space-between; align-items:center; gap:6px; margin-top:8px}
.kmv{display:flex; gap:6px}
.kmv .mv{width:36px; height:36px; border:1px solid var(--line-strong); border-radius:50%; background:var(--surface); color:var(--ink); font-size:18px; line-height:1; transition:border-color .15s,background .15s}
.kmv .mv:disabled{opacity:.3; cursor:default}
.kmv .mv:not(:disabled):hover{border-color:var(--gold); background:var(--gold-soft)}
.addcard{width:100%; min-height:40px; border:1px dashed var(--line-strong); border-radius:var(--r-sm); background:transparent; color:var(--muted); font-size:14px; transition:border-color .15s,color .15s}
.addcard:hover{border-color:var(--gold); color:var(--ink)}
.addin{width:100%; border-color:var(--gold)}
.klog{display:flex; flex-direction:column; gap:6px; margin-top:8px}
.klog div{font-size:14px; display:flex; gap:10px; align-items:baseline}
.klog time{color:var(--muted); font-size:12.5px; min-width:48px}

/* ---------- Gestion locative ---------- */
.lkpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px}
.lkc{padding:18px 20px}
.lkv{font-size:32px; line-height:1.1; font-weight:800; font-variant-numeric:lining-nums tabular-nums; margin-top:4px}
.lkv.ok{color:var(--teal-ink)} .lkv.bad{color:var(--warn)}
.alrt{display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line)}
.alrt:last-child{border-bottom:0}
.alrt .dot{width:9px; height:9px; border-radius:50%; background:var(--muted)}
.alrt.warn .dot{background:var(--warn)} .alrt.brass .dot{background:var(--gold)} .alrt.sky .dot{background:var(--info)}
.covgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.selrow{cursor:pointer} .selrow:hover td{background:var(--sunk)} .selrow.on td{background:var(--gold-soft)}
.revbox{border:1px solid var(--line); border-radius:var(--r-sm); padding:14px 16px; background:var(--bg); margin-top:8px}
.docs{display:grid; gap:8px; margin-top:8px}
.docs .chip{min-width:96px; justify-content:center}
.bar{height:6px; background:var(--sunk); border-radius:3px; overflow:hidden; margin-top:8px} .bar i{display:block; height:100%; background:var(--teal-ink)}
.tl{display:flex; flex-direction:column; gap:10px}
.ech{display:grid; grid-template-columns:28px minmax(0,1fr); gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--bg)}
.ech.entrant{border-left:3px solid var(--info)} .ech.sortant{border-left:3px solid var(--teal-ink)}
.ech .ico{width:26px; height:26px; border-radius:50%; background:var(--sunk); display:grid; place-items:center; font-size:13px}
.bk{display:flex; justify-content:space-between; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line)} .bk:last-child{border-bottom:0}
.bksel{max-width:180px; min-height:40px; font-size:14px}
.stp{display:grid; grid-template-columns:repeat(9,1fr); gap:3px; margin-top:10px} .stp i{height:6px; border-radius:3px; background:var(--sunk)} .stp i.d{background:var(--teal-ink)} .stp i.c{background:var(--gold)}
.tstep{display:grid; grid-template-columns:14px minmax(0,1fr); gap:10px; padding:10px 0; border-left:2px solid var(--line); margin-left:5px; padding-left:14px; position:relative}
.tstep .dot{position:absolute; left:-8px; top:14px; width:14px; height:14px; border-radius:50%; background:var(--sunk); border:2px solid var(--line-strong)}
.tstep.ok .dot{background:var(--teal-ink); border-color:var(--teal-ink)} .tstep.warn .dot{background:var(--warn); border-color:var(--warn)} .tstep.next .dot{background:var(--surface); border-color:var(--gold)}

/* ---------- toast ---------- */
.toast{position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(8px); background:var(--ink); color:var(--surface); padding:12px 20px; border-radius:var(--pill); font-size:14.5px; font-weight:500; z-index:80; opacity:0; transition:opacity .2s,transform .2s; pointer-events:none; max-width:calc(100% - 32px); text-align:center; box-shadow:var(--shadow-pop)}
.toast.on{opacity:1; transform:translateX(-50%)}

/* ---------- responsive ---------- */
@media (max-width:1100px){ .kpis,.lkpis,.methods{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:980px){
  .split,.brief,.grid2,.grid3,.vitrine .body{grid-template-columns:minmax(0,1fr)}
  .pipeline{grid-template-columns:1fr 1fr}
  .pipeline > div:nth-child(2){border-right:0}
  .pipeline > div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .acqwrap{grid-template-columns:1fr} .acqlist{position:static; max-height:none}
  .parcgrid,.parcgrid3{grid-template-columns:1fr}
  .covgrid{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .tb-brand{display:inline}
  .crumb::before{content:"/"; margin-right:10px; color:var(--line-strong)}
  main{padding:20px 16px calc(104px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); border-top:1px solid var(--line); padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .tabbar button{all:unset; box-sizing:border-box; cursor:pointer; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:56px; font-size:12px; font-weight:500; color:var(--muted); text-align:center; border-radius:var(--r-sm)}
  .tabbar button[aria-current="page"]{color:var(--ink); font-weight:700}
  .tabbar button[aria-current="page"]::before{content:""; position:absolute; top:0; left:28%; right:28%; height:3px; border-radius:0 0 3px 3px; background:var(--gold)}
  .tabbar button:focus-visible{outline:2px solid var(--focus); outline-offset:-2px}
  .tabbar svg{width:23px; height:23px}
  .scrim:not([hidden]){display:block; position:fixed; inset:0; z-index:50; background:rgba(25,22,23,.55); border:0}
  .sheet:not([hidden]){display:block; position:fixed; left:0; right:0; bottom:0; z-index:55; background:var(--surface); border-radius:20px 20px 0 0; padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px)); box-shadow:var(--shadow-pop); max-height:82vh; overflow:auto; animation:sheetin .22s ease-out}
  @keyframes sheetin{from{transform:translateY(24px); opacity:0}to{transform:none; opacity:1}}
  .sheet .grab{width:40px; height:4px; border-radius:2px; background:var(--line-strong); margin:4px auto 12px}
  .sheet .sh-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px}
  .sheet .grp{margin-top:12px}
  .sheet .grp-label{color:var(--muted); padding:0 4px 6px}
  .sheet .grp button{all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:14px; min-height:52px; padding:0 8px; border-radius:var(--r-sm); font-weight:500; font-size:16px}
  .sheet .grp button:active,.sheet .grp button:hover{background:var(--sunk)}
  .sheet .grp button[aria-current="page"]{font-weight:700; background:var(--gold-soft)}
  .sheet .grp button:focus-visible{outline:2px solid var(--focus); outline-offset:-2px}
  .sheet svg{width:22px; height:22px; flex:none}
  .studio{height:68vh; min-height:440px}
  .roomcard{top:auto; bottom:70px; right:10px; left:10px; width:auto}
  .match{grid-template-columns:70px minmax(0,1fr)} .score{width:66px; height:66px} .score b{font-size:20px}
  .why{grid-template-columns:1fr}
  .vitrine .body{padding:22px}
  .bars .b{grid-template-columns:110px 1fr 44px}
  .portal{grid-template-columns:minmax(0,1fr) auto}
  .alert{grid-template-columns:1fr auto} .alert .chip{grid-column:1/-1; justify-self:start}
  .assist{border-radius:var(--r); flex-wrap:wrap; padding:8px} .assist input{flex-basis:100%; order:-1; padding:10px}
  .assist .btn{flex:1}
  .panel{padding:18px}
  .action{grid-template-columns:32px 1fr} .action .btn{grid-column:2; justify-self:start}
  .adj{grid-template-columns:1fr 60px} .adj input[type=range]{grid-column:1/-1; grid-row:2}
  .acqct,.newgrid,.parcctl,.kpis,.lkpis,.covgrid{grid-template-columns:1fr}
  .methods{grid-template-columns:1fr 1fr}
  .kanban{grid-template-columns:repeat(5,78vw); scroll-snap-type:x proximity}
  .kanban .col{scroll-snap-align:start}
  .head{margin-bottom:18px}
  .crit .imp button{min-height:40px}
}
@media (max-width:560px){ #aiChip{display:none} }
@media (pointer:coarse){
  .btn.sm{min-height:44px}
  .kmv .mv{width:44px; height:44px}
  .imp button,.seg button{min-height:40px}
  .addcard{min-height:44px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
  .kc.landed{outline:2px solid var(--gold)}
}
@media print{ .rail,.topbar,.tabbar{display:none} .app{display:block} }

</style>

let SAMPLE = null;
if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('sample').then(s => { SAMPLE = s; document.querySelectorAll('[data-ai-status]').forEach(el=>el.textContent='IA connectée'); }).catch(()=>{});
}
const aiLabel = () => SAMPLE ? 'IA connectée' : 'Mode hors ligne : réponses types';
function aiErr(e){ const c=e&&e.code; if(c==='not_granted'){ SAMPLE=null; return "L'accès à Claude a été refusé pour cette page, je bascule sur les réponses types."; } if(c==='rate_limited') return 'Trop de demandes rapprochées, réessayez dans une minute.'; return "L'IA n'a pas répondu, réponse type affichée à la place."; }
async function aiJSON(prompt, fallback){
  if(!SAMPLE) return {data:fallback(), offline:true};
  try { const d = await SAMPLE.json(prompt, {modelTier:'quick'}); return {data:d}; }
  catch(e){ return {data:fallback(), offline:true, msg:aiErr(e)}; }
}
async function aiText(prompt, onText, fallback){
  if(!SAMPLE){ const t=fallback(); onText(t); return {text:t, offline:true}; }
  try { const r = await SAMPLE(prompt, {modelTier:'quick', onText:({text})=>onText(text)}); return r; }
  catch(e){ const t=(e&&e.text)||fallback(); onText(t); return {text:t, offline:true, msg:aiErr(e)}; }
}

function micButton(targetSel){

}
let rec=null;
document.addEventListener('click', e => {
  const m = e.target.closest('[data-mic]'); if(!m) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR) return;
  if(rec){ rec.stop(); return; }
  const ta = $(m.dataset.mic); rec = new SR(); rec.lang='fr-FR'; rec.interimResults=true; rec.continuous=true;
  const base = ta.value ? ta.value+' ' : '';
  rec.onresult = ev => { let t=''; for(const r of ev.results) t+=r[0].transcript; ta.value = base+t; };
  rec.onend = () => { m.setAttribute('aria-pressed','false'); rec=null; };
  rec.onerror = () => { toast('Micro indisponible ici, écrivez la note.'); };
  m.setAttribute('aria-pressed','true'); rec.start();
});

function computeDVF(S){
  const now = new Date('2026-04-01');
  let rows = DVF.comps.map(c=>({date:c[0], rue:c[1], surf:c[2], terr:c[3], prix:c[4], pieces:c[5], pm2:c[4]/c[2]}))
    .filter(r=>r.surf>=S*0.8 && r.surf<=S*1.25 && r.terr>=500);
  const sorted = rows.map(r=>r.pm2).sort((a,b)=>a-b);
  const q = p => sorted[Math.min(sorted.length-1, Math.max(0, Math.round(p*(sorted.length-1))))];
  const q1=q(.25), q3=q(.75), iqr=q3-q1, lo=q1-1.5*iqr, hi=q3+1.5*iqr;
  rows.forEach(r=>{
    const months = (now - new Date(r.date))/2.63e9;
    r.w = Math.exp(-Math.abs(r.surf-S)/(S*0.2)) * Math.exp(-months/20) * (r.terr>=800?1:0.8);
    r.out = r.pm2<Math.max(lo,0.55*q(.5)) || r.pm2>hi || r.terr>6000;
    r.reason = r.terr>6000 ? 'Grand terrain : le prix mêle bâti et terres, comparaison faussée' : r.pm2<Math.max(lo,0.55*q(.5)) ? 'Très en dessous du marché : vente familiale ou travaux lourds probables' : r.pm2>hi ? 'Très au-dessus du marché : bien d’exception probable' : '';
  });
  const kept = rows.filter(r=>!r.out).sort((a,b)=>a.pm2-b.pm2);
  const tot = kept.reduce((s,r)=>s+r.w,0);
  const wq = p => { let acc=0; for(const r of kept){ acc+=r.w; if(acc>=p*tot) return r.pm2; } return kept.at(-1)?.pm2||0; };
  const neff = tot*tot / kept.reduce((s,r)=>s+r.w*r.w,0);
  return {rows:rows.sort((a,b)=>b.date.localeCompare(a.date)), med:wq(.5), p25:wq(.25), p75:wq(.75), n:kept.length, neff};
}

    const inset=.06;
    const set=[ seg(r.w,th, r.x+r.w/2, r.z+inset), seg(r.w,th, r.x+r.w/2, r.z+r.d-inset), seg(th,r.d, r.x+inset, r.z+r.d/2), seg(th,r.d, r.x+r.w-inset, r.z+r.d/2) ];
    rooms.push({r, floor, walls:set, level:r.f});
  });
  const roof1 = new T.Mesh(new T.BoxGeometry(8.4,.14,4.4), mat(0xB86B4B)); roof1.position.set(4, H0*2+.4, 2); roof1.visible=false; scene.add(roof1);
  let wallH = low;
  const setWalls = h => { wallH=h; walls.forEach(m=>{ m.scale.y=h; m.position.y = m.userData.y0 + .1 + h/2; }); };
  setWalls(low);
  let level='all';

  const applyLevel = () => { lvlG[1].position.set(level==='all'?0:0, level==='all'?3.4:0, 0); lvlG.forEach((g,i)=>g.visible = level==='all' || +level===i); };
  applyLevel();
  // camera orbit
  let theta = -0.75, phi = 0.95, dist = 34;
  const placeCam = () => { cam.position.set(center.x + dist*Math.sin(phi)*Math.sin(theta), center.y + dist*Math.cos(phi), center.z - dist*Math.sin(phi)*Math.cos(theta)); cam.lookAt(center); const needle=$('#needle'); if(needle) needle.setAttribute('transform',`rotate(${(theta*180/Math.PI).toFixed(1)} 17 17)`); };
  placeCam();
  const pts = new Map(); let lastPinch=0, moved=0;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e=>{ el.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; });
  el.addEventListener('pointermove', e=>{ if(!pts.has(e.pointerId)) return; const p=pts.get(e.pointerId); const dx=e.clientX-p.x, dy=e.clientY-p.y; pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved+=Math.abs(dx)+Math.abs(dy);
    if(pts.size===1){ theta -= dx*0.008; phi = Math.min(1.45, Math.max(0.25, phi - dy*0.006)); }
    else if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(lastPinch) dist=Math.min(70,Math.max(12, dist*(lastPinch/d))); lastPinch=d; }
    placeCam(); });
  const up = e=>{ pts.delete(e.pointerId); if(pts.size<2) lastPinch=0; if(moved<6 && e.type==='pointerup') pick(e); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', e=>{ e.preventDefault(); dist=Math.min(70,Math.max(12, dist*(1+Math.sign(e.deltaY)*0.08))); placeCam(); }, {passive:false});
  const ray = new T.Raycaster(), ndc = new T.Vector2();
  function pick(e){ const rect=el.getBoundingClientRect(); ndc.set(((e.clientX-rect.left)/rect.width)*2-1, -((e.clientY-rect.top)/rect.height)*2+1); ray.setFromCamera(ndc, cam);
    const hit = ray.intersectObjects(rooms.filter(o=>lvlG[o.level].visible).map(o=>o.floor))[0]; const card=$('#roomcard');
    rooms.forEach(o=>o.floor.material.emissive.setHex(0));
    if(!hit){ card.hidden=true; return; }
    const r=hit.object.userData; hit.object.material.emissive.setHex(0x2a2410);
    card.hidden=false; card.innerHTML=`<h3>${esc(r.n)}</h3><p style="margin-top:6px">${esc(r.info)}</p><p class="small" style="margin-top:8px;color:#5B5A5E">${r.w} × ${r.d} m, niveau ${r.f?'étage':'rez-de-chaussée'}</p>`; }
  // sun: 21 décembre, Avignon (approx. lever SE ~122°, culmination ~23°)
  const sunCtl=$('#sun'), sunT=$('#sunT');
  const setSun = v => { const t=v/100; const az = (122 + t*116) * Math.PI/180; const elev = Math.max(0.03, Math.sin(Math.PI*t)) * 23 * Math.PI/180;
    const R=50; // azimut compté depuis le nord (+z) vers l'est (+x)
    sun.position.set(center.x + R*Math.cos(elev)*Math.sin(az), R*Math.sin(elev)+0.5, center.z + R*Math.cos(elev)*Math.cos(az));
    const h = 8.25 + t*8.7; sunT.textContent = Math.floor(h)+' h '+String(Math.round((h%1)*60)).padStart(2,'0');
    sun.intensity = 0.35 + 0.85*Math.sin(Math.PI*t); sun.color.setHSL(0.09, 0.6, 0.55 + 0.25*Math.sin(Math.PI*t)); };
  sunCtl.oninput = () => setSun(+sunCtl.value); setSun(+sunCtl.value);
  host.querySelectorAll('[data-lvl]').forEach(b=>b.onclick=()=>{ level=b.dataset.lvl; host.querySelectorAll('[data-lvl]').forEach(x=>x.setAttribute('aria-pressed', x===b)); applyLevel(); });
  host.querySelectorAll('[data-walls]').forEach(b=>b.onclick=()=>{ setWalls(b.dataset.walls==='high'?2.6:low); host.querySelectorAll('[data-walls]').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  // labels
  const labels=$('#labels'); labels.innerHTML = rooms.map((o,i)=>`<span class="rl" data-i="${i}">${esc(o.r.n)}</span>`).join('');
  const lv = [...labels.children]; const v3=new T.Vector3();
  let raf; const loop=()=>{ raf=requestAnimationFrame(loop); renderer.render(scene,cam);
    rooms.forEach((o,i)=>{ const el2=lv[i]; if(!lvlG[o.level].visible){ el2.style.display='none'; return; } o.floor.getWorldPosition(v3); v3.y+=0.4; v3.project(cam); el2.style.display = v3.z<1?'block':'none'; el2.style.left=((v3.x+1)/2*W())+'px'; el2.style.top=((1-v3.y)/2*H())+'px'; }); };
  loop();
  const ro = new ResizeObserver(()=>{ renderer.setSize(W(),H()); cam.aspect=W()/H(); cam.updateProjectionMatrix(); }); ro.observe(host);
  return { dispose(){ cancelAnimationFrame(raf); ro.disconnect(); renderer.dispose(); } };
}

function parseNeedLocal(t){
  const s=t.toLowerCase(), c=[];
  const b = s.match(/(\d[\d\s.]{2,})\s*(k|000|€|euros)/); if(b){ let v=+b[1].replace(/[\s.]/g,''); if(b[2]==='k') v*=1000; if(v<10000) v*=1000; c.push({id:'budget', valeur:v, frais_inclus:/frais|compris|inclus/.test(s), importance:3, imperatif:true, citation:b[0]}); }
  const ch = s.match(/(\d)\s*chambres?/); if(ch) c.push({id:'chambres', valeur:+ch[1], importance:3, imperatif:false, citation:ch[0]});
  if(/avignon/.test(s)) c.push({id:'avignon_max', valeur:20, importance:2, imperatif:false, citation:'mutation à Avignon'});
  if(/jardin|terrain/.test(s)) c.push({id:'jardin', valeur:true, importance:2, imperatif:false, citation:'jardin'});
  if(/piscine/.test(s)) c.push({id:'piscine', valeur:true, importance:/pas obligatoire|un plus|bonus/.test(s)?1:2, imperatif:false, citation:'la piscine serait un plus'});
  if(/sud/.test(s)) c.push({id:'expo_sud', valeur:true, importance:3, imperatif:/impérati|absolument|obligatoire/.test(s), citation:'exposition sud impérative'});
  if(/garage|dépendance|atelier/.test(s)) c.push({id:'annexe', valeur:true, importance:2, imperatif:false, citation:'garage ou dépendance'});
  if(/école/.test(s)) c.push({id:'ecole_pied', valeur:10, importance:2, imperatif:false, citation:'école primaire à pied'});
  const g = s.match(/gare[^.]*?(\d{1,2})\s*min/); if(g) c.push({id:'gare_tgv', valeur:+g[1], importance:2, imperatif:false, citation:g[0]});
  if(/mitoyen/.test(s)) c.push({id:'non_mitoyen', valeur:true, importance:2, imperatif:true, citation:'pas de mitoyenneté'});
  return {resume:"Famille de quatre en mutation, cherche une maison familiale ensoleillée près d'Avignon, avec un vrai usage du train vers Paris.", criteres:c, questions:["Le budget inclut-il d'éventuels travaux, et jusqu'à combien ?","Quelle école est visée : publique de secteur ou privée ?","La dépendance doit-elle être chauffée et raccordée pour un usage d'atelier ?"]};
}
function scoreListing(L, crit){
  let sw=0, ss=0, failImp=false; const yes=[], no=[];
  const frais = c => c.frais_inclus ? 1.075 : 1;
  crit.forEach(c=>{
    let s=0, why='';
    switch(c.id){
      case 'budget': { const tot=L.prix*frais(c); s = tot<=c.valeur?1 : tot<=c.valeur*1.06?0.6:0; why = s===1?`Dans le budget (${eur(tot)}${c.frais_inclus?' avec frais estimés':''})`: s?`Dépasse de ${Math.round((tot/c.valeur-1)*100)} %, à négocier`:`Hors budget (${eur(tot)})`; break; }
      case 'avignon_max': s = L.avi<=c.valeur?1:L.avi<=c.valeur+10?0.5:0; why=`${L.avi} min d'Avignon`; break;
      case 'chambres': s = L.ch>=c.valeur?1 : (L.ch===c.valeur-1 && L.conv)?0.75 : L.ch===c.valeur-1?0.4:0; why = `${L.ch} chambres${L.conv&&L.ch<c.valeur?', un bureau peut devenir chambre':''}`; break;
      case 'jardin': s = L.terr>=300?1:L.terr>=80?0.3:0; why = L.terr>=300?`Jardin de ${fmt(L.terr)} m²`:`Extérieur de ${L.terr} m² seulement`; break;
      case 'piscine': s = L.pisc?1:0; why = L.pisc?'Piscine':'Pas de piscine'; break;
      case 'expo_sud': s = L.expo==='Sud'?1:/Sud/.test(L.expo)?0.75:0.1; why = `Exposition ${L.expo.toLowerCase()}`; break;
      case 'annexe': s = (L.garage||L.dep)?1:0; why = L.dep?'Dépendance':L.garage?'Garage':'Ni garage ni dépendance'; break;
      case 'ecole_pied': s = L.ecole<=c.valeur?1:L.ecole<=c.valeur+5?0.5:0; why = `École à ${L.ecole} min à pied`; break;
      case 'gare_tgv': s = L.gare<=c.valeur?1:L.gare<=c.valeur+10?0.5:0; why = `Gare TGV à ${L.gare} min`; break;
      case 'non_mitoyen': s = L.mit?0:1; why = L.mit?'Mitoyenne':'Indépendante'; break;
      default: return;
    }
    const w = c.importance||2; sw+=w; ss+=w*s;
    (s>=0.75?yes:no).push(why);
    if(c.imperatif && s<0.5) failImp=true;
  });
  let pct = sw? Math.round(ss/sw*100) : 0; if(failImp) pct=Math.min(pct,40);
  return {pct, yes, no, failImp};
}

function pipeLogHTML(){
  return pipeLog.length ? pipeLog.slice(0,6).map(l=>`<div><time>${l[0]}</time><span>${esc(l[1])}</span></div>`).join('') : '<p class="small muted">Aucun mouvement pour l\u2019instant. Glissez une carte d\u2019une colonne à l\u2019autre.</p>';
}
function moveCard(ci,i,tj,idx){
  const ks=Object.keys(PIPE); const card=PIPE[ks[ci]].splice(i,1)[0];
  const dest=PIPE[ks[tj]]; idx=Math.max(0,Math.min(idx,dest.length)); dest.splice(idx,0,card);
  const hm=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  if(ci!==tj){ pipeLog.unshift([hm, card[0]+' : '+ks[ci]+' → '+ks[tj]]);
    toast(tj===ks.length-1 ? card[0]+' : mandat signé, félicitations' : (tj>=1&&card[2]==='none') ? 'Aucun consentement : courrier seulement, pas d\u2019appel' : card[0]+' → '+ks[tj]); }
  else pipeLog.unshift([hm, card[0]+' : repositionné dans '+ks[tj]]);
  refreshKanban(tj,idx);
}
function refreshKanban(tj,idx){
  const root=$('#kanban'); if(!root) return; const sl=root.scrollLeft;
  root.innerHTML=kanbanHTML(); root.scrollLeft=sl; $('#klog').innerHTML=pipeLogHTML();
  const t=$('#kcount'); if(t) t.textContent=Object.values(PIPE).reduce((a,v)=>a+v.length,0)+' dossiers';
  bindKanban();
  if(tj!=null){ const el=root.querySelector(`.kc[data-ci="${tj}"][data-i="${idx}"]`); if(el) el.classList.add('landed'); }
}
function bindKanban(){
  const root=$('#kanban'); if(!root) return; const ks=Object.keys(PIPE);
  root.querySelectorAll('.mv').forEach(b=>b.onclick=()=>{ const card=b.closest('.kc'); const ci=+card.dataset.ci, i=+card.dataset.i, tj=ci+(+b.dataset.dir); if(tj<0||tj>=ks.length) return; moveCard(ci,i,tj,PIPE[ks[tj]].length); });
  root.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const ci=+b.dataset.add; const inp=document.createElement('input'); inp.className='addin'; inp.placeholder='Nom du vendeur, puis Entrée'; inp.setAttribute('aria-label','Nom du nouveau dossier');
    b.replaceWith(inp); inp.focus(); let done=false;
    const fin=ok=>{ if(done) return; done=true; const v=inp.value.trim(); if(ok&&v){ PIPE[ks[ci]].push([v,'Ajouté à la main','none']); pipeLog.unshift([new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}), v+' ajouté dans '+ks[ci]]); refreshKanban(ci,PIPE[ks[ci]].length-1); } else refreshKanban(); };
    inp.onkeydown=e=>{ if(e.key==='Enter') fin(true); else if(e.key==='Escape') fin(false); }; inp.onblur=()=>fin(true);
  });
  root.querySelectorAll('.kc').forEach(card=>card.addEventListener('pointerdown',e=>{
    if(e.button>0 || e.target.closest('button')) return;
    if(e.pointerType!=='mouse' && !e.target.closest('.grip')) return;
    const ci=+card.dataset.ci, i=+card.dataset.i, sx=e.clientX, sy=e.clientY, r0=card.getBoundingClientRect(), ox=sx-r0.left, oy=sy-r0.top;
    let ghost=null, mark=null, tcol=null, idx=0, lastCol=null;
    const move=ev=>{
      if(!ghost){ if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return;
        ghost=card.cloneNode(true); ghost.classList.add('kghost'); ghost.style.width=r0.width+'px'; document.body.appendChild(ghost);
        card.classList.add('dragging'); document.body.classList.add('kdrag'); mark=document.createElement('div'); mark.className='dropmark'; }
      ev.preventDefault();
      ghost.style.left=(ev.clientX-ox)+'px'; ghost.style.top=(ev.clientY-oy)+'px';
      const kr=root.getBoundingClientRect(); if(ev.clientX<kr.left+40) root.scrollLeft-=14; else if(ev.clientX>kr.right-40) root.scrollLeft+=14;
      const el=document.elementFromPoint(ev.clientX,ev.clientY); const col=el&&el.closest?el.closest('.col'):null;
      if(lastCol&&lastCol!==col) lastCol.classList.remove('over');
      if(col&&root.contains(col)){ col.classList.add('over'); lastCol=col; tcol=+col.dataset.col;
        const list=col.querySelector('.cards'); const others=[...list.querySelectorAll('.kc:not(.dragging)')];
        idx=others.findIndex(c=>{ const r=c.getBoundingClientRect(); return ev.clientY<r.top+r.height/2; }); if(idx<0) idx=others.length;
        if(others[idx]) list.insertBefore(mark,others[idx]); else list.appendChild(mark);
      } else { tcol=null; lastCol=null; if(mark&&mark.parentNode) mark.remove(); }
    };
    const up=()=>{
      document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',cancel);
      if(!ghost) return; ghost.remove(); document.body.classList.remove('kdrag'); if(mark&&mark.parentNode) mark.remove(); if(lastCol) lastCol.classList.remove('over');
      if(tcol!=null) moveCard(ci,i,tcol,idx); else card.classList.remove('dragging');
    };
    const cancel=()=>{ tcol=null; up(); };
    document.addEventListener('pointermove',move,{passive:false}); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',cancel);
  }));
}

  if(t==='baux'){ document.querySelectorAll('[data-bail]').forEach(r=>r.onclick=()=>{ locState.bail=r.dataset.bail; locRefresh(); });
    const rb=$('#revBtn'); if(rb) rb.onclick=()=>{ const bb=bailOf(locState.bail); const txt=MODELES.revision[1]({b:bb}); locState.comp={partie:bb.t, canal:'Courrier recommandé', modele:'revision', texte:txt}; toast('Notification préparée, à relire dans les échanges'); locGo('ech'); }; }
  if(t==='loc'){ document.querySelectorAll('[data-ten]').forEach(r=>r.onclick=()=>{ locState.tenant=r.dataset.ten; locRefresh(); });
    document.querySelectorAll('[data-write]').forEach(r=>r.onclick=()=>{ const id=r.dataset.write; locState.comp={partie:id, canal:LOCS[id].canal==='SMS'?'SMS':'E-mail', modele:'', texte:''}; locGo('ech'); });
    document.querySelectorAll('[data-quit]').forEach(r=>r.onclick=()=>{ const id=r.dataset.quit, bb=BAUX.find(x=>x.t===id); const ref=logEch({dt:nowStamp(), canal:'Portail', sens:'sortant', partie:id, lot:bb.id, objet:'Votre quittance de septembre est disponible', txt:'Quittance de loyer de septembre 2026 mise à disposition dans votre espace locataire.', pj:['quittance-2026-09.pdf']}); toast('Quittance envoyée et archivée'); locRefresh(); }); }
  if(t==='dep'){ ['#rsBail','#rsCles','#rsEdl','#rsDate','#rsImp','#rsRep','#rsCopro'].forEach(s=>{ const el=$(s); if(el){ el.oninput=resCalc; el.onchange=resCalc; } }); if($('#rsBail')) resCalc(); }
  if(t==='enc'){
    document.querySelectorAll('[data-bkok]').forEach(b=>b.onclick=()=>{ const m=BANK.find(x=>x.id===b.dataset.bkok); const sel=document.querySelector(`[data-bk="${m.id}"]`); m.match=sel.value; m.auto=false; toast(`${eur2(m.amt)} pointés sur ${bailOf(m.match).code}`); locRefresh(); });
    document.querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>{ const bb=bailOf(b.dataset.rel); locState.comp={partie:bb.t, canal:'E-mail', modele:'relance', texte:MODELES.relance[1]({b:bb})}; locGo('ech'); });
    document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{ const p=b.dataset.rv; revState[p]=Math.min(3,revState[p]+1); toast(revState[p]===1?'Lot de virements préparé':revState[p]===2?'Validation 1/2 : en attente du second valideur':'Validation 2/2 : fichier SEPA prêt'); locRefresh(); });
    document.querySelectorAll('[data-sepa]').forEach(b=>b.onclick=()=>toast('Démonstration : le fichier de virements SEPA serait remis à la banque'));
    const cb=$('#crgBtn'); if(cb) cb.onclick=()=>{ Object.keys(PROPS).forEach(p=>logEch({dt:nowStamp(), canal:'E-mail', sens:'sortant', partie:p, lot:null, objet:'Compte rendu de gestion, octobre 2026', txt:'Compte rendu de gestion et détail du reversement.', pj:['CRG-2026-10.pdf']})); toast('5 comptes rendus de gestion édités et archivés'); }; }
  if(t==='trav') bindTrav();
  if(t==='ech') bindEch();
  if(t==='sor') bindSor();
}
function bindTrav(){
  const nw=$('#newWork'); if(nw) nw.onclick=()=>{ locState.tForm=!locState.tForm; locRefresh(); };
  document.querySelectorAll('[data-dv]').forEach(r=>r.onchange=()=>{ locState.resChoice['w'+r.dataset.dv]=r.value; locRefresh(); });
  document.querySelectorAll('[data-wa]').forEach(btn=>btn.onclick=()=>{ const [id,act]=btn.dataset.wa.split(':'); const w=TRAV.find(x=>x.id===id), b=bailOf(w.bail), pr=PROPS[b.p];
    if(act==='next') w.step=2;
    else if(act==='quote'){ const ps=PRESTA.filter(p=>p.metiers.includes(w.metier)&&prestaOk(p)).slice(0,2); if(!ps.length){ toast('Aucun prestataire conforme pour ce métier'); return; } w.step=2; ps.forEach(p=>logEch({dt:nowStamp(), canal:'E-mail', sens:'sortant', partie:p.id, lot:b.id, objet:'Demande de devis : '+w.obj.slice(0,60), txt:w.obj+'. Merci de chiffrer et d\u2019indiquer votre délai.', pj:[]})); toast('Demande de devis envoyée à '+ps.map(p=>p.nom).join(' et ')); }
    else if(act==='retain'){ const c=locState.resChoice['w'+id]; if(!c){ toast('Choisissez d\u2019abord un devis'); return; } const d=w.devis.find(x=>x.p===c); w.choix=c; w.devisChoisi=d.m; if(d.m>pr.seuil){ logEch({dt:nowStamp(), canal:'E-mail', sens:'sortant', partie:b.p, lot:b.id, objet:'Accord demandé sur devis de '+eur2(d.m), txt:`Le devis de ${partieNom(c)} (${eur2(d.m)} TTC) dépasse votre seuil de ${eur2(pr.seuil)}. Nous vous demandons votre accord.`, pj:['devis.pdf']}); w.step=4; toast('Accord demandé au propriétaire, enregistré comme obtenu dans la démonstration'); } else { w.step=4; toast('Sous le seuil du mandat : validé directement'); } }
    else if(act==='plan'){ w.plan='2026-10-16'; w.step=5; logEch({dt:nowStamp(), canal:'E-mail', sens:'sortant', partie:w.choix, lot:b.id, objet:'Ordre de service : '+w.obj.slice(0,60), txt:'Ordre de service pour une intervention le 16 octobre 2026, accès par le gestionnaire. Facture à adresser à Expertimo au nom du mandant.', pj:[]}); toast('Ordre de service envoyé, intervention le 16/10'); }
    else if(act==='done'){ w.step=6; toast('Intervention marquée comme réalisée'); }
    else if(act==='bill'){ const m=(w.devis.find(d=>d.p===w.choix)||{}).m||0; w.fact={date:'2026-10-09', m}; w.step=7; toast('Facture de '+eur2(m)+' enregistrée, déduite du prochain reversement'); }
    else if(act==='pay'){ w.step=8; toast('Prestataire réglé sur les fonds du propriétaire'); }
    locRefresh(); });
  const m=()=>{ const g=id=>$(id)?$(id).value:''; locState.tw={bail:g('#twBail'), metier:g('#twMet'), urg:g('#twUrg'), imp:g('#twImp'), desc:g('#twDesc')}; };
  ['#twBail','#twUrg','#twImp'].forEach(s=>{ const el=$(s); if(el) el.onchange=m; });
  const mt=$('#twMet'); if(mt) mt.onchange=()=>{ m(); locRefresh(); };
  const tc=$('#twCancel'); if(tc) tc.onclick=()=>{ locState.tForm=false; locState.tw=null; locRefresh(); };
  const ts=$('#twSend'); if(ts) ts.onclick=async()=>{ m(); const f=locState.tw; const ps=[...document.querySelectorAll('.twP:checked')].map(x=>x.value); const b=bailOf(f.bail);
    if(!f.desc.trim()){ $('#twOut').textContent='Décrivez le problème pour que les prestataires puissent chiffrer.'; return; } if(!ps.length){ $('#twOut').textContent='Choisissez au moins un prestataire conforme.'; return; }
    const out=$('#twOut'); ts.disabled=true; out.innerHTML='<span class="thinking">Rédaction de la demande</span>';
    const fb=()=>`Bonjour,\n\nNous gérons le logement ${b.lot} pour le compte de son propriétaire. Intervention ${f.urg.toLowerCase()} : ${f.desc.trim()}\n\nMerci de nous adresser un devis détaillé TTC et votre premier créneau disponible. L\u2019accès au logement est organisé par nos soins. La facture sera établie au nom du mandant, à notre attention.\n\nCordialement,\nExpertimo, gestion locative`;
    const prompt=`Tu écris, pour un gestionnaire locatif, une demande de devis de 80 mots maximum à un prestataire. Métier : ${f.metier}. Logement : ${b.lot}. Urgence : ${f.urg}. Problème : ${f.desc}. Demande un devis détaillé TTC, un créneau, indique que l'accès est organisé par le gestionnaire et que la facture est au nom du mandant. Ne donne aucune donnée personnelle du locataire. Réponds avec le message seul, vouvoiement.`;
    const r=await aiText(prompt, tx=>{ out.textContent=tx; }, fb); ts.disabled=false; const txt=out.textContent||fb();
    ps.forEach(id=>logEch({dt:nowStamp(), canal:'E-mail', sens:'sortant', partie:id, lot:b.id, objet:'Demande de devis : '+f.metier+', '+b.lot, txt, pj:[]}));
    const nid='w'+(TRAV.length+1); TRAV.unshift({id:nid, bail:b.id, obj:f.desc.trim().slice(0,110), metier:f.metier, urg:f.urg, par:'Gestionnaire', date:'2026-10-09', imp:f.imp, step:2, devis:[], choix:null});
    locState.tForm=false; locState.tw=null; toast('Demande envoyée à '+ps.length+' prestataire'+(ps.length>1?'s':'')+', archivée dans les échanges'); locRefresh(); };
}
function bindEch(){
  const q=$('#eQ'); if(q) q.oninput=()=>{ locState.q=q.value; const l=ECH.filter(e=>(locState.fCanal==='all'||e.canal===locState.fCanal)&&(locState.fLot==='all'||e.lot===locState.fLot)&&(!locState.q||(e.objet+' '+e.txt+' '+partieNom(e.partie)).toLowerCase().includes(locState.q.toLowerCase()))).sort((a,b)=>a.dt<b.dt?1:-1); $('#eList').innerHTML=l.length?l.map(e=>echItem(e,true)).join(''):'<p class="small muted">Aucun échange pour ces filtres.</p>'; };
  const fc=$('#eCanal'); if(fc) fc.onchange=()=>{ locState.fCanal=fc.value; locRefresh(); };
  const fl=$('#eLot'); if(fl) fl.onchange=()=>{ locState.fLot=fl.value; locRefresh(); };
  const sync=()=>{ const c=locState.comp; c.partie=$('#cPart').value; c.canal=$('#cCanal').value; c.texte=$('#cTxt').value; };
  const cp=$('#cPart'); if(cp) cp.onchange=()=>{ sync(); const c=locState.comp; if(c.modele){ const bb=BAUX.find(x=>x.t===c.partie); c.texte=MODELES[c.modele][1]({b:bb}); } locRefresh(); };
  const cc=$('#cCanal'); if(cc) cc.onchange=()=>{ sync(); locRefresh(); };
  const cm=$('#cMod'); if(cm) cm.onchange=()=>{ sync(); const c=locState.comp; c.modele=cm.value; const bb=BAUX.find(x=>x.t===c.partie)||BAUX.find(x=>x.p===c.partie); c.texte=c.modele?MODELES[c.modele][1]({b:bb}):''; locRefresh(); };
  const ct=$('#cTxt'); if(ct) ct.oninput=()=>{ locState.comp.texte=ct.value; };
  const ai=$('#cAi'); if(ai) ai.onclick=async()=>{ sync(); const c=locState.comp; if(!c.texte.trim()){ toast('Écrivez ou choisissez un modèle d\u2019abord'); return; } ai.disabled=true; const prompt=`Reformule ce message d'un gestionnaire locatif à ${partieNom(c.partie)}. Canal : ${c.canal}. Ton professionnel et chaleureux, vouvoiement, pas plus long que l'original, aucun montant ni date nouveaux. Message : """${c.texte}""" Réponds avec le message seul.`; const r=await aiText(prompt, tx=>{ $('#cTxt').value=tx; locState.comp.texte=tx; }, ()=>c.texte); ai.disabled=false; if(r.msg) toast(r.msg); };
  const sd=$('#cSend'); if(sd) sd.onclick=()=>{ sync(); const c=locState.comp; if(!c.texte.trim()){ toast('Le message est vide'); return; } const bb=BAUX.find(x=>x.t===c.partie)||BAUX.find(x=>x.p===c.partie);
    const ref=logEch({dt:nowStamp(), canal:c.canal, sens:'sortant', partie:c.partie, lot:bb?bb.id:null, objet:c.modele?MODELES[c.modele][0]:(c.canal==='Appel'?'Appel':'Message'), txt:c.texte, pj:[]});
    locState.comp={partie:c.partie, canal:c.canal, modele:'', texte:''}; toast((c.canal==='Appel'?'Appel consigné':'Message envoyé')+' et archivé, empreinte '+ref.slice(4,12)); locRefresh(); };
}
function bindSor(){
  document.querySelectorAll('[data-sor]').forEach(b=>b.onclick=()=>{ const a=b.dataset.sor, bb=bailOf('b6');
    if(a==='conv'){ locState.comp={partie:'t6', canal:'Courrier recommandé', modele:'edl', texte:MODELES.edl[1]({b:bb})}; locGo('ech'); }
    else if(a==='dep'){ locState.resChoice.bail='b6'; locGo('dep'); }
    else { locState.tw={bail:'b6', metier:'Peinture', urg:'Planifiable', imp:'À déterminer', desc:'Remise en état après départ : peinture du séjour, rebouchage de 4 trous, remplacement ou réparation du plan de travail.'}; locState.tForm=true; locGo('trav'); } });
  const eb=$('#edlBtn'); if(!eb) return;
  eb.onclick = async () => { const out=$('#edlOut'), b=$('#edlBtn'); b.disabled=true; out.innerHTML='<span class="thinking">Analyse</span>';
    const fb=()=>"Deux dégradations imputables au locataire semblent établies : les quatre trous de fixation du séjour et la brûlure du plan de travail. Les joints noircis de la salle d'eau relèvent plutôt de l'usure normale après quatre ans et ne devraient pas être retenus. L'usure du sol de la chambre est identique à l'entrée. Avant toute retenue sur le dépôt de garantie : appliquer la grille de vétusté prévue au bail et joindre devis ou factures.";
    const prompt=`Tu assistes un gestionnaire locatif. Bail de 4 ans. Compare l'état des lieux d'entrée et de sortie et dis, en 90 mots maximum, ce qui relève vraisemblablement d'une dégradation imputable au locataire et ce qui relève de l'usure normale. Rappelle d'appliquer la grille de vétusté et de justifier toute retenue par devis ou facture. Ne chiffre rien.\n- Séjour murs : entrée bon état ; sortie 4 trous de fixation\n- Cuisine plan de travail : entrée bon état ; sortie brûlure de 5 cm\n- Chambre 1 sol : usure légère aux deux\n- Salle d'eau joints : entrée neufs ; sortie noircis\nRéponds avec l'analyse seule.`;
    const r=await aiText(prompt, t=>{ out.textContent=t; }, fb); b.disabled=false; if(r.msg) toast(r.msg); };
}

const VIEWS = { today:[viewToday,bindToday], biens:[viewBiens,bindBiens], acq:[viewAcq,bindAcq], radar:[viewRadar,bindRadar], loc:[viewLoc,bindLoc], pilot:[viewPilot,()=>{}], visib:[viewVisib,bindVisib], auto:[viewAuto,bindAuto], abo:[viewAbo,bindAbo], revue:[viewRevue,()=>{}] };
function render(){
  if(three && !(state.view==='biens' && state.bienTab==='studio')){ three.dispose(); three=null; }
  renderNav();
  const [v,b] = VIEWS[state.view]; const el = $('#view');
  el.innerHTML = v(); b();
  el.classList.remove('in'); void el.offsetWidth; el.classList.add('in');
}
$('#themeBtn').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };
render();
</script>
